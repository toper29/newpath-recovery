version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: rehab_admin
      POSTGRES_PASSWORD: rehab_secure_pass_123
      POSTGRES_DB: rehab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehab_admin -d rehab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
